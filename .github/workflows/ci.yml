name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, "release-please--branches--**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: windows-latest, python: "3.12"}
          - {os: macos-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest ruff pyyaml blosc "dcc-mcp-core>=0.20.3,<1"
      - run: python -m pytest

  lint-and-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest ruff pyyaml blosc "dcc-mcp-core>=0.20.3,<1"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - name: Validate and pack the Skill
        shell: bash
        run: |
          dcc-mcp-cli lint skill/cache-inspection --warnings-as-errors
          dcc-mcp-cli marketplace pack skill/cache-inspection --out dist/
          python -c "import pathlib, zipfile; archive=next(pathlib.Path('dist').glob('*.zip')); names=zipfile.ZipFile(archive).namelist(); assert any(name.endswith('SKILL.md') for name in names); assert any(name.endswith('scripts/_bgeo_parser.py') for name in names); assert not any('__pycache__' in name or name.endswith('.pyc') for name in names)"
