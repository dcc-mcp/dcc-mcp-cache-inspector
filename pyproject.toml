[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-cache-inspector"
version = "0.1.0"
description = "Read-only bgeo/bgeo.sc cache inspection — no Houdini required. Extract metadata, attribute lists, bounding boxes, and compatibility info from Houdini geometry caches."
authors = [{ name = "Long Hao", email = "hal.long@outlook.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["houdini", "bgeo", "bgeo.sc", "cache", "inspection", "mcp", "dcc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

dependencies = [
    "json5>=0.9",
]

[project.optional-dependencies]
blosc = ["blosc2>=2.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.8.0",
    "hatchling",
    "build",
    "blosc2>=2.0",
]

[project.urls]
Homepage = "https://github.com/dcc-mcp/dcc-mcp-cache-inspector"
Repository = "https://github.com/dcc-mcp/dcc-mcp-cache-inspector"

[project.scripts]
dcc-mcp-cache-inspector = "dcc_mcp_cache_inspector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_cache_inspector"]
artifacts = [
    "src/dcc_mcp_cache_inspector/skills/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "PIE"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
