[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-cache-inspector"
version = "0.2.0" # x-release-please-version
description = "Bounded Houdini-free SideFX geo, bgeo, and bgeo.sc cache inspection with typed DCC-MCP tools."
authors = [{ name = "Long Hao", email = "hal.long@outlook.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["houdini", "bgeo", "bgeo.sc", "cache", "inspection", "mcp", "dcc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

dependencies = [
    "blosc>=1.11.2,<2.0.0",
    "dcc-mcp-core>=0.19.91,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.8.0",
    "pyyaml>=6.0",
    "build",
    "twine>=7.0; python_version >= '3.10'",
    "twine>=6.2,<7.0; python_version < '3.10'",
]

[project.urls]
Homepage = "https://github.com/dcc-mcp/dcc-mcp-cache-inspector"
Repository = "https://github.com/dcc-mcp/dcc-mcp-cache-inspector"

[project.scripts]
dcc-mcp-cache-inspector = "dcc_mcp_cache_inspector.cli:main"

[project.entry-points."dcc_mcp.adapters"]
cache-inspector = "dcc_mcp_cache_inspector.server:CacheInspectorMcpServer"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_cache_inspector"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/**/*.png", "docs/**/*.svg", "docs/**/*.webp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "PIE"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
